<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Plugin HTML Editor</title>
        <link rel="stylesheet" href="./index.css" />
        <script type="text/javascript" src="./index.js"></script>
    </head>
    <body>
        <div class="container">
            <h2 class="title">Editor HTML</h2>
            <form action="#" class="form">
                <div class="input-group">
                    <textarea
                        id="html"
                        rows="10"
                        class="input"
                    ></textarea>
                </div>
                <div class="input-group">
                    <input
                        id="save"
                        type="submit"
                        class="button"
                        value="Guardar"
                    />
                    <input
                        id="close"
                        type="button"
                        class="button"
                        value="Cerrar"
                    />
                </div>
            </form>
        </div>
    </body>
</html>
